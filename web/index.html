<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineLens</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 90vh; margin: 0;
         background: #f0f6ff; color: #1f3864; gap: 12px; }
  h1 { margin: 0; font-size: 32px; }
  p { margin: 0; color: #556; font-size: 14px; }
  button { padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px;
           background: #1f3864; color: #fff; cursor: pointer; }
  button:hover { background: #2a4a85; }
  #result { font-size: 14px; color: #555; max-width: 560px; text-align: center;
            white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <h1>DineLens</h1>
  <p>前端托管在 Cloudflare Pages · 后端通过隧道连接家里的电脑</p>
  <button onclick="testBackend()">测试后端连通</button>
  <div id="result">未测试</div>

<script>
async function testBackend() {
  const el = document.getElementById('result');
  el.textContent = '请求中...';
  try {
    const resp = await fetch('/api/', { cache: 'no-store' });
    const text = await resp.text();
    el.textContent = '后端返回: HTTP ' + resp.status + '\n' + text.slice(0, 300);
  } catch (err) {
    el.textContent = '请求失败: ' + err;
  }
}
</script>
</body>
</html>
